        <h1>Censoor Contact Form</h1>
        <hr class=headerline>
        <!--WHATEVER THE WEBSITE IS-->
        <section>
           <p>If you would like to contact us at Censoor, please fill out this form.</p>
            <form action="">
               <fieldset>
                    <label for="firstname">First Name:</label>
                    <input type="firstname" id="firstname" required> <br>
                    <label for="lastname">Last Name:</label>
                    <input type="lastname" id="lastname" required> <br>
                    <label for="email">E-Mail Address:</label>
                    <input type="email" id="email" required> <br>
                    <label for="phone">Phone Number:</label>
                    <input type="phone" id="phone" placeholder> <br>
                    <label for="commentcatagory">Subject of Comment</label>
                    <select name="commentcatagory" id="commentcatagory">
                        <option value="ask"></option>
                    </select>
                    <label for="comments">Comments</label><br>
                    <textarea name="comments" id="comments" rows="5" cols="50"></textarea><br>
                    <input type="submit" id="submit" value="Submit" />
                    <input type="reset" id="reset" value="Reset" />
                </fieldset>
            </form>
            <a href="" id=vhs>Back to the Homepage</a>
        </section>
